<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="אירועים בכפר סבא, רעננה והוד השרון — לוח מתעדכן ויומן להרשמה">
<title>אירועים בכפר סבא והסביבה</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#15171a;--muted:#68707b;--line:#e4e7eb;--accent:#1267d6;--chip:#eef4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1050px;margin:auto;padding:28px 18px 56px}header{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0}.sub{color:var(--muted);margin:.45rem 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;text-decoration:none;cursor:pointer;font:inherit}
.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip.active{background:var(--chip);border-color:#9bbff0;color:#0d4e9c}
.search{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font:inherit;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 2px 8px #00000008}
.when{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#0d4e9c;font-weight:700}.price{font-size:.9rem;background:#eef8ef;color:#22672d;border-radius:999px;padding:3px 8px}
h2{font-size:1.28rem;line-height:1.25;margin:.55rem 0}.where,.desc{margin:.35rem 0}.where,.desc,.meta{color:var(--muted)}.meta{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px;font-size:.9rem}
.details{color:var(--accent);font-weight:650;text-decoration:none}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:25px;text-align:center;color:var(--muted)}footer{margin-top:28px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body><main>
<header><div><h1>אירועים בכפר סבא והסביבה</h1><p class="sub">כפר סבא · רעננה · הוד השרון</p></div>
<div class="actions"><a class="button primary" href="webcal://mim21.github.io/kfar-saba-events/calendar.ics">📅 Apple – הרשמה</a><a class="button" href="https://calendar.google.com/calendar/r?cid=https%3A%2F%2Fmim21.github.io%2Fkfar-saba-events%2Fcalendar.ics" target="_blank" rel="noopener noreferrer">📅 Google – הרשמה</a></div></header>
<input id="search" class="search" type="search" placeholder="חיפוש לפי אירוע, מקום או קטגוריה…" aria-label="חיפוש אירועים">
<div class="filters" aria-label="סינון אירועים">
<button class="chip active" data-filter="all">הכול</button><button class="chip" data-filter="today">היום</button><button class="chip" data-filter="tomorrow">מחר</button><button class="chip" data-filter="week">7 ימים</button><button class="chip" data-filter="city:כפר סבא">כפר סבא</button><button class="chip" data-filter="city:רעננה">רעננה</button><button class="chip" data-filter="city:הוד השרון">הוד השרון</button><button class="chip" data-filter="free">חינם</button>
</div>
<section id="grid" class="grid"></section><p id="empty" class="empty" hidden>לא נמצאו אירועים לפי הסינון.</p>
<footer>עודכן לאחר שינוי אמיתי בנתונים: 10.08.2026 22:08 · <a href="events.json">JSON</a> · <a href="calendar.ics">ICS</a></footer>
<script>
const cards=[...document.querySelectorAll('.card')], chips=[...document.querySelectorAll('.chip')], search=document.getElementById('search'), empty=document.getElementById('empty');
let filter='all'; const iso=d=>d.toLocaleDateString('en-CA',{timeZone:'Asia/Jerusalem'});
function visible(c){const q=search.value.trim().toLocaleLowerCase('he'); if(q && !c.dataset.search.includes(q))return false; if(filter==='all')return true; if(filter==='free')return c.dataset.free==='1'; if(filter.startsWith('city:'))return c.dataset.city===filter.slice(5); const now=new Date(), today=iso(now); if(filter==='today')return c.dataset.date===today; const t=new Date(now); t.setDate(t.getDate()+1); if(filter==='tomorrow')return c.dataset.date===iso(t); if(filter==='week'){const end=new Date(now);end.setDate(end.getDate()+7);return c.dataset.date>=today&&c.dataset.date<=iso(end)} return true}
function apply(){let n=0;cards.forEach(c=>{const show=visible(c);c.hidden=!show;if(show)n++});empty.hidden=n!==0}
chips.forEach(b=>b.addEventListener('click',()=>{chips.forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;apply()}));search.addEventListener('input',apply);apply();
</script>
</main></body></html>
