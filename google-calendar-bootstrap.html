<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kfar Saba Events — Google Calendar bootstrap</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#111;color:#eee}button{font-size:18px;padding:12px 18px;border-radius:12px;border:0}textarea{width:100%;height:65vh;margin-top:16px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#181818;color:#f5f5f5;border:1px solid #444;border-radius:12px;padding:14px;box-sizing:border-box}p{line-height:1.45}.ok{color:#8f8}</style></head><body><h1>Kfar Saba Events — Google Calendar bootstrap</h1><p>Tap <b>Copy Code.gs</b>, then paste into a new Google Apps Script project and run <code>setupKfarSabaEvents</code>.</p><button id="copy">Copy Code.gs</button><p id="status"></p><textarea id="code" readonly>const N='Kfar Saba Events',TZ='Asia/Jerusalem',SA='merhav-cal-sync@merhav-cal-sync.iam.gserviceaccount.com';
function setupKfarSabaEvents(){
 let a=CalendarApp.getOwnedCalendarsByName(N);
 if(a.length&gt;1)throw Error('More than one '+N+' calendar exists');
 let c=a[0]||CalendarApp.createCalendar(N,{description:'Public automatically updated events calendar for Kfar Saba, Raanana and Hod Hasharon.',timeZone:TZ,selected:true});
 c.setTimeZone(TZ);c.setSelected(true);
 let id=c.getId(),t=ScriptApp.getOAuthToken();
 function q(method,url,body){
  let o={method:method,headers:{Authorization:'Bearer '+t},muteHttpExceptions:true};
  if(body){o.contentType='application/json';o.payload=JSON.stringify(body)}
  let r=UrlFetchApp.fetch(url,o),s=r.getContentText();
  if(r.getResponseCode()&lt;200||r.getResponseCode()&gt;299)throw Error(s);
  return s?JSON.parse(s):{};
 }
 let base='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(id)+'/acl';
 let items=(q('get',base).items||[]);
 function acl(scope,role){
  let x=items.find(i=&gt;i.scope&amp;&amp;i.scope.type===scope.type&amp;&amp;(i.scope.value||'')===(scope.value||''));
  if(!x)q('post',base+'?sendNotifications=false',{scope:scope,role:role});
  else if(x.role!==role)q('patch',base+'/'+encodeURIComponent(x.id)+'?sendNotifications=false',{role:role});
 }
 acl({type:'default'},'reader');
 acl({type:'user',value:SA},'writer');
 console.log('CALENDAR_ID='+id);
 console.log('GOOGLE_URL=https://calendar.google.com/calendar/render?cid='+encodeURIComponent(id));
 console.log('RESULT=OK');
}</textarea><script>const b=document.getElementById('copy'),c=document.getElementById('code'),s=document.getElementById('status');b.onclick=async()=>{try{await navigator.clipboard.writeText(c.value);s.textContent='Copied to clipboard';s.className='ok'}catch(e){c.focus();c.select();document.execCommand('copy');s.textContent='Copied to clipboard';s.className='ok'}};</script></body></html>
